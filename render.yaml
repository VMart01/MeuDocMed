services:
  - type: web
    name: meudocmed
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers=1 --threads=8 --worker-class=gthread --timeout=120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/uploads
      # Configure as variáveis abaixo no painel do Render:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: meudocmed-db
      #     property: connectionString
      # - key: MAIL_SERVER
      #   value: smtp.gmail.com
      # - key: MAIL_PORT
      #   value: "587"
      # - key: MAIL_USERNAME
      #   sync: false
      # - key: MAIL_PASSWORD
      #   sync: false
      # - key: MAIL_DEFAULT_SENDER
      #   sync: false
    disk:
      name: uploads-disk
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
