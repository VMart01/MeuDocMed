<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar — {{ doc.name }} | MeuDocMed</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #f3f4f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Barra superior */
    #topbar {
      height: 52px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }

    #topbar .brand {
      font-weight: 700;
      color: #3b82f6;
      font-size: .9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #topbar .doc-name {
      flex: 1;
      font-size: .82rem;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #topbar .badge-readonly {
      background: #78350f;
      color: #fde68a;
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
      white-space: nowrap;
      letter-spacing: .03em;
    }

    #topbar .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #374151;
      color: #d1d5db;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: .82rem;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
    }
    #topbar .btn-back:hover { background: #4b5563; }

    /* Área de conteúdo */
    #viewer-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      overflow-x: hidden;
      background: #111827;
    }

    /* PDF: iframe sandboxed (sem allow-downloads = botão download desabilitado) */
    #pdf-frame {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
    }

    /* Imagem em canvas */
    #img-canvas {
      max-width: 96vw;
      max-height: calc(100vh - 52px);
      object-fit: contain;
      box-shadow: 0 4px 20px rgba(0,0,0,.6);
      margin: 16px auto;
      display: block;
    }

    /* Texto */
    #txt-pre {
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      margin: 16px;
      width: calc(100% - 32px);
      max-width: 860px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'Courier New', monospace;
      font-size: .88rem;
      line-height: 1.6;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }

    /* Loading / Erro */
    #loading, #error-msg {
      margin: auto;
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
    #loading .fa-spinner { font-size: 2.5rem; color: #3b82f6; animation: spin 1s linear infinite; }
    #loading p { margin-top: 12px; font-size: .9rem; }
    #error-msg { color: #f87171; display: none; }
    #error-msg .fa-circle-exclamation { font-size: 2rem; }
    #error-msg p { margin-top: 12px; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Barra superior -->
<div id="topbar">
  <span class="brand"><i class="fa fa-file-medical"></i> MeuDocMed</span>
  <span class="doc-name">{{ doc.name }}</span>
  <span class="badge-readonly"><i class="fa fa-eye"></i> Somente leitura</span>
  <a href="{{ url_for('professional.prontuario', patient_id=patient_id) }}" class="btn-back">
    <i class="fa fa-arrow-left"></i> Voltar
  </a>
</div>

<!-- Área de conteúdo -->
<div id="viewer-area">
  <div id="loading">
    <div><i class="fa fa-spinner"></i></div>
    <p>Carregando documento…</p>
  </div>
  <div id="error-msg">
    <i class="fa fa-circle-exclamation"></i>
    <p>Não foi possível carregar o documento.</p>
  </div>
</div>

<!-- Bloqueia atalhos de teclado e menu de contexto -->
<script>
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && ['s','p','u','a'].indexOf(e.key.toLowerCase()) !== -1) {
      e.preventDefault();
    }
  });
</script>

{% set ext_lower = ext | lower %}

{% if ext_lower == 'pdf' %}
<!-- PDF: iframe com sandbox sem allow-downloads.
     O Chrome desabilita o botão de download do viewer nativo dentro de iframes sandboxed. -->
<script>
  var RAW_URL = {{ raw_url | tojson }};
  var area    = document.getElementById('viewer-area');
  var loading = document.getElementById('loading');

  var frame = document.createElement('iframe');
  frame.id  = 'pdf-frame';
  frame.src = RAW_URL;
  // allow-same-origin: envia cookies de sessão
  // SEM allow-downloads: desabilita botão de download do viewer nativo
  // SEM allow-scripts: impede JS dentro do iframe
  frame.setAttribute('sandbox', 'allow-same-origin');
  frame.setAttribute('title', {{ doc.name | tojson }});

  frame.addEventListener('load', function() {
    loading.style.display = 'none';
    frame.style.display   = 'block';
  });
  frame.style.display = 'none';
  area.appendChild(frame);

  // Fallback: se demorar > 15s, mostra erro
  setTimeout(function() {
    if (loading.style.display !== 'none') {
      loading.style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    }
  }, 15000);
</script>

{% elif ext_lower in ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp'] %}
<!-- Imagem: fetch → blob → canvas (URL nunca exposta ao navegador) -->
<script>
  var RAW_URL = {{ raw_url | tojson }};
  var area    = document.getElementById('viewer-area');
  var loading = document.getElementById('loading');

  fetch(RAW_URL, { credentials: 'same-origin' })
    .then(function(r) {
      if (!r.ok) throw new Error('fetch failed');
      return r.blob();
    })
    .then(function(blob) {
      var blobUrl = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function() {
        var canvas   = document.createElement('canvas');
        canvas.id    = 'img-canvas';
        var maxW     = window.innerWidth  * 0.94;
        var maxH     = window.innerHeight - 70;
        var ratio    = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
        canvas.width  = img.naturalWidth  * ratio;
        canvas.height = img.naturalHeight * ratio;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(blobUrl); // descarta a URL imediatamente
        loading.style.display = 'none';
        area.appendChild(canvas);
      };
      img.onerror = function() { throw new Error('img load failed'); };
      img.src = blobUrl;
    })
    .catch(function() {
      loading.style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    });
</script>

{% elif ext_lower == 'txt' %}
<!-- Texto puro: fetch → pre -->
<script>
  var RAW_URL = {{ raw_url | tojson }};
  var area    = document.getElementById('viewer-area');
  var loading = document.getElementById('loading');

  fetch(RAW_URL, { credentials: 'same-origin' })
    .then(function(r) {
      if (!r.ok) throw new Error();
      return r.text();
    })
    .then(function(text) {
      var pre      = document.createElement('pre');
      pre.id       = 'txt-pre';
      pre.textContent = text;
      loading.style.display = 'none';
      area.appendChild(pre);
    })
    .catch(function() {
      loading.style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    });
</script>

{% endif %}

</body>
</html>
